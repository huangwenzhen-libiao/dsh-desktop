name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Build
        shell: pwsh
        run: ./Build.ps1
      - name: Test installer and backend contracts
        shell: pwsh
        run: ./Test.ps1
      - name: Test Windows PowerShell installer compatibility
        shell: powershell
        run: |
          ./Tools/Test-Prerequisites.ps1
          ./Tools/Test-DependencyInstaller.ps1
      - name: Package
        shell: pwsh
        run: ./Package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-win-x64
          path: artifacts
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content ./DesktopApp/DSHarness.Desktop.csproj -Raw
          if ($env:GITHUB_REF_NAME -ne ('v' + $project.Project.PropertyGroup.Version)) { throw 'Tag and project version differ.' }
          gh release create $env:GITHUB_REF_NAME ./artifacts/*.zip ./artifacts/SHA256SUMS.txt --verify-tag --title "DSH Desktop $env:GITHUB_REF_NAME" --generate-notes
